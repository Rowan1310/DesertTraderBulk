name: Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - run: dotnet build DesertTraderBulk/DesertTraderBulk.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: DesertTraderBulk
          path: DesertTraderBulk/DesertTraderBulk/bin/Release/net6.0/
