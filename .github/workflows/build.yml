
name: Build DesertTraderBulk

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore
        run: dotnet restore DesertTraderBulk.vbproj

      - name: Build
        run: dotnet build DesertTraderBulk.vbproj --configuration Release --no-restore

      - name: Prepare mod package
        run: |
          mkdir -p package/DesertTraderBulk
          cp manifest.json package/DesertTraderBulk/
          cp bin/Release/net6.0/DesertTraderBulk.dll package/DesertTraderBulk/
          cd package
          zip -r ../DesertTraderBulk.zip DesertTraderBulk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesertTraderBulk-Android
          path: DesertTraderBulk.zip
          
