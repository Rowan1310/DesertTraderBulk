
name: Build DesertTraderBulk

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore DesertTraderBulk.vbproj

      - name: Build
        run: dotnet build DesertTraderBulk.vbproj -c Release --no-restore

      - name: Prepare package
        run: |
          mkdir -p package/DesertTraderBulk
          cp manifest.json package/DesertTraderBulk/
          cp bin/Release/net9.0/DesertTraderBulk.dll package/DesertTraderBulk/
          cd package
          zip -r ../DesertTraderBulk.zip DesertTraderBulk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: DesertTraderBulk-Android
          path: DesertTraderBulk.zip
          
